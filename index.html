<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TAN</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TAN">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F5E6E6">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%23DCD3E8'/><text x='90' y='120' font-family='-apple-system,sans-serif' font-size='72' font-weight='700' fill='white' text-anchor='middle' letter-spacing='-1'>TAN</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='32' height='32' rx='8' fill='%23DCD3E8'/><text x='16' y='23' font-family='-apple-system,sans-serif' font-size='14' font-weight='700' fill='white' text-anchor='middle'>T</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  // PWA Service Worker - 先禁用避免缓存问题
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
</script>
<style>
  :root{
    --bg:#F5E6E6; --card:#FFFFFF; --ink:#3A3A3C; --ink2:#6E6E73; --ink3:#A1A1A6;
    --line:#E8D8D8; --accent:#C6D5EA; --accent2:#DCD3E8; --accent3:#C6D5EA; --accent4:#FEFBB4;
    --rose:#DCD3E8; --sage:#C6D5EA; --sky:#C6D5EA; --butter:#FEFBB4; --clay:#DCD3E8;
    --shadow:0 4px 20px rgba(58,58,60,.06); --shadow2:0 8px 30px rgba(58,58,60,.10);
    --radius:16px; --radius-s:10px; --radius-l:22px;
    --sidebar-w:240px; --sidebar-collapsed:76px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);outline:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:8px;opacity:.4}
  ::-webkit-scrollbar-track{background:transparent}

  /* ===== Layout ===== */
  .app{display:flex;height:100vh;width:100vw}
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--card); border-right:1px solid var(--line);
    display:flex; flex-direction:column; transition:width .28s cubic-bezier(.4,0,.2,1); z-index:20;
    position:relative;
  }
  .sidebar.collapsed{width:var(--sidebar-collapsed)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(58,58,60,.3);z-index:19;backdrop-filter:blur(2px)}
  @media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);transform:translateX(0);z-index:30;box-shadow:var(--shadow2)}
    .sidebar.collapsed{transform:translateX(calc(-1 * var(--sidebar-w)));width:var(--sidebar-w)}
    .sidebar-overlay{display:block}
    .sidebar.collapsed + .sidebar-overlay{display:none}
    .topbar{padding:0 16px}
    #btnMenuToggle{display:flex!important}
    .content{padding:16px 12px 120px}
    .fab{right:16px;bottom:20px}
    .ai-panel{right:16px;bottom:88px;width:calc(100vw - 32px)}
    .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .stat{padding:14px 16px}
    .stat-val{font-size:22px}
    .grid-2,.grid-3{grid-template-columns:1fr}
  }
  .sidebar-head{padding:20px 18px 14px; display:flex; align-items:center; gap:10px; min-height:64px}
  .sidebar .btn-collapse-mobile{
    display:none;position:absolute;right:-40px;top:18px;width:36px;height:36px;border-radius:0 10px 10px 0;
    background:var(--card);border:1px solid var(--line);border-left:none;font-size:16px;color:var(--ink2);
    align-items:center;justify-content:center;z-index:31;box-shadow:2px 2px 8px rgba(0,0,0,.06);
  }
  @media(max-width:768px){.sidebar .btn-collapse-mobile{display:flex}}
  .logo-mark{
    width:36px;height:36px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--clay),var(--rose));
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;
    box-shadow:0 4px 12px rgba(220,211,232,.35);letter-spacing:-0.5px;
  }
  .logo-text{display:flex;flex-direction:column;line-height:1.2;overflow:hidden;white-space:nowrap}
  .logo-text b{font-size:16px;font-weight:600}
  .logo-text span{font-size:11px;color:var(--ink3)}
  .collapsed .logo-text,.collapsed .nav-label,.collapsed .nav-section-title,.collapsed .sidebar-foot-text{display:none}
  .collapsed .sidebar-head{justify-content:center;padding:20px 0}

  .nav{flex:1;overflow-y:auto;padding:8px 12px}
  .nav-section-title{font-size:11px;color:var(--ink3);padding:14px 10px 6px;letter-spacing:.5px;font-weight:500}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-s);
    color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px;
    transition:all .18s; position:relative;
  }
  .nav-item:hover{background:#F5E6E6;color:var(--ink)}
  .nav-item.active{background:linear-gradient(135deg,rgba(220,211,232,.18),rgba(198,213,234,.14));color:var(--clay)}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--clay);border-radius:0 3px 3px 0}
  .nav-ico{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
  .collapsed .nav-item{justify-content:center;padding:12px 0}
  .collapsed .nav-item.active::before{left:-12px}

  .sidebar-foot{padding:12px;border-top:1px solid var(--line)}
  .btn-collapse{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;
    border-radius:var(--radius-s);color:var(--ink2);font-size:13px;transition:all .18s;
  }
  .btn-collapse:hover{background:#F5E6E6}
  .collapse-ico{transition:transform .28s}
  .collapsed .collapse-ico{transform:rotate(180deg)}

  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{
    height:60px;flex-shrink:0;background:rgba(247,244,239,.85);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;z-index:10;
  }
  .topbar-title{font-size:17px;font-weight:600}
  .topbar-sub{font-size:12px;color:var(--ink3);margin-left:10px;font-weight:400}
  .topbar-actions{display:flex;gap:8px;align-items:center}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-s);
    font-size:13px;font-weight:500;transition:all .15s;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  }
  .btn:hover{background:#F5E6E6;color:var(--ink)}
  .btn-primary{background:var(--clay);color:#fff;border-color:transparent}
  .btn-primary:hover{background:#B0A0C0;color:#fff}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:#F5E6E6}
  .btn-sm{padding:6px 10px;font-size:12px}
  .btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:10px}

  .content{flex:1;overflow-y:auto;padding:24px 28px 100px}
  .view{display:none;animation:fade .3s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== Cards & Stats ===== */
  .card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid rgba(232,216,216,.6)}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .card-h h3{font-size:15px;font-weight:600}
  .card-h .sub{font-size:12px;color:var(--ink3)}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .stat{
    background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);
    border:1px solid rgba(232,216,216,.6);position:relative;overflow:hidden;
  }
  .stat::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;opacity:.12}
  .stat.s1::after{background:var(--clay)} .stat.s2::after{background:var(--sage)} .stat.s3::after{background:var(--sky)} .stat.s4::after{background:var(--butter)}
  .stat-label{font-size:12px;color:var(--ink3);margin-bottom:6px}
  .stat-val{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .stat-val small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:4px}
  .stat-trend{font-size:11px;margin-top:4px;color:var(--ink2)}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

  /* ===== Forms ===== */
  .form-row{display:grid;gap:10px;margin-bottom:12px}
  .form-row.r2{grid-template-columns:1fr 1fr}
  .form-row.r3{grid-template-columns:1fr 1fr 1fr}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--ink2);font-weight:500}
  .field input,.field select,.field textarea{
    padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:#FAF3F3;
    transition:all .15s;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--clay);background:#fff;box-shadow:0 0 0 3px rgba(220,211,232,.12)}
  .field textarea{resize:vertical;min-height:60px}

  /* ===== Table / List ===== */
  .list{display:flex;flex-direction:column;gap:8px}
  .list-item{
    background:var(--card);border-radius:var(--radius-s);padding:14px 16px;display:flex;align-items:center;gap:14px;
    border:1px solid rgba(232,216,216,.5);transition:all .15s;
  }
  .list-item:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
  .list-item.done{opacity:.55}
  .list-item.done .li-title{text-decoration:line-through;color:var(--ink3)}
  .li-main{flex:1;min-width:0}
  .li-title{font-weight:500;font-size:14px;margin-bottom:2px}
  .li-sub{font-size:12px;color:var(--ink3);display:flex;gap:10px;flex-wrap:wrap}
  .li-sub span{display:inline-flex;align-items:center;gap:3px}
  .li-actions{display:flex;gap:6px;flex-shrink:0}

  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;line-height:1.5}
  .tag-paid{background:rgba(198,213,234,.25);color:#7A8BA8}
  .tag-making{background:rgba(220,211,232,.3);color:#8A7E9B}
  .tag-delivery{background:rgba(198,213,234,.3);color:#6B7B8A}
  .tag-done{background:rgba(220,211,232,.2);color:#A890A0}
  .tag-income{background:rgba(198,213,234,.25);color:#7A8BA8}
  .tag-expense{background:rgba(245,230,230,.2);color:#A890A0}

  .checkbox{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--line);cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .checkbox.checked{background:var(--sage);border-color:var(--sage)}
  .checkbox.checked::after{content:"✓";color:#fff;font-size:13px;font-weight:bold}

  .empty{text-align:center;padding:40px 20px;color:var(--ink3);font-size:13px}
  .empty-ico{font-size:32px;margin-bottom:8px;opacity:.5}

  /* ===== Progress ===== */
  .progress{height:8px;background:#EDE0E0;border-radius:8px;overflow:hidden;margin-top:6px}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--sage),var(--clay));border-radius:8px;transition:width .5s}

  /* ===== Countdown cards ===== */
  .cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .cd-card{
    background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
    border:1px solid rgba(232,216,216,.6);position:relative;overflow:hidden;
  }
  .cd-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .cd-card.c1::before{background:var(--rose)} .cd-card.c2::before{background:var(--sage)}
  .cd-card.c3::before{background:var(--sky)} .cd-card.c4::before{background:var(--butter)}
  .cd-card.c5::before{background:var(--clay)}
  .cd-name{font-size:13px;color:var(--ink2);margin-bottom:4px}
  .cd-date{font-size:11px;color:var(--ink3);margin-bottom:10px}
  .cd-days{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1}
  .cd-days small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:4px}
  .cd-days.urgent{color:var(--clay)}

  /* ===== Floating AI Button ===== */
  .fab{
    position:fixed;right:28px;bottom:28px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--clay),var(--rose));box-shadow:0 8px 24px rgba(220,211,232,.4);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:100;
    transition:all .25s;
  }
  .fab:hover{transform:scale(1.08) rotate(-5deg);box-shadow:0 12px 32px rgba(220,211,232,.5)}
  .fab svg{width:28px;height:28px;fill:#fff}
  .fab-pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--clay);animation:pulse 2s infinite;opacity:.6}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.5);opacity:0}}

  .ai-panel{
    position:fixed;right:28px;bottom:96px;width:380px;max-width:calc(100vw - 56px);
    background:var(--card);border-radius:var(--radius-l);box-shadow:var(--shadow2);
    border:1px solid var(--line);z-index:101;overflow:hidden;
    transform:translateY(20px) scale(.95);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1);
    transform-origin:bottom right;
  }
  .ai-panel.open{transform:none;opacity:1;pointer-events:auto}
  .ai-head{padding:16px 18px;background:linear-gradient(135deg,var(--clay),var(--rose));color:#fff;display:flex;align-items:center;gap:10px}
  .ai-head b{font-size:14px;font-weight:600}
  .ai-head span{font-size:11px;opacity:.85}
  .ai-close{margin-left:auto;color:#fff;font-size:18px;opacity:.8;cursor:pointer}
  .ai-close:hover{opacity:1}
  .ai-body{padding:14px 16px;max-height:300px;overflow-y:auto}
  .ai-hint{font-size:12px;color:var(--ink3);margin-bottom:10px}
  .ai-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .ai-chip{padding:6px 10px;background:#F5E6E6;border-radius:8px;font-size:12px;color:var(--ink2);cursor:pointer;transition:all .15s}
  .ai-chip:hover{background:var(--clay);color:#fff}
  .ai-log{display:flex;flex-direction:column;gap:8px}
  .ai-msg{padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5}
  .ai-msg.user{background:#F5E6E6;align-self:flex-end;max-width:85%}
  .ai-msg.bot{background:rgba(220,211,232,.12);color:var(--ink);align-self:flex-start;max-width:90%}
  .ai-msg.bot b{color:var(--clay)}
  .ai-input-wrap{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:8px;background:#FAF3F3}
  .ai-input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:#fff}
  .ai-input:focus{border-color:var(--clay);box-shadow:0 0 0 3px rgba(220,211,232,.12)}
  .ai-send{padding:0 14px;background:var(--clay);color:#fff;border-radius:var(--radius-s);font-weight:500}
  .ai-send:hover{background:#B0A0C0}

  /* ===== Modal ===== */
  .modal-mask{
    position:fixed;inset:0;background:rgba(58,58,60,.4);backdrop-filter:blur(4px);z-index:200;
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-mask.open{opacity:1;pointer-events:auto}
  .modal{
    background:var(--card);border-radius:var(--radius-l);width:90%;max-width:640px;max-height:85vh;
    overflow:hidden;box-shadow:var(--shadow2);transform:scale(.95);transition:transform .2s;
    display:flex;flex-direction:column;
  }
  .modal-mask.open .modal{transform:none}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:16px;font-weight:600}
  .modal-body{padding:20px 22px;overflow-y:auto;flex:1}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#FAF3F3}

  /* ===== Week Report ===== */
  .week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
  .week-card{background:#FAF3F3;border-radius:var(--radius);padding:14px 16px;border:1px solid rgba(232,216,216,.5)}
  .week-card h4{font-size:12px;color:var(--ink3);margin-bottom:6px;font-weight:500}
  .week-card .v{font-size:22px;font-weight:700;letter-spacing:-.5px}
  .insight{background:linear-gradient(135deg,rgba(220,211,232,.1),rgba(198,213,234,.1));border-radius:var(--radius);padding:16px;border:1px solid rgba(220,211,232,.2)}
  .insight h4{font-size:13px;color:var(--clay);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .insight p{font-size:13px;color:var(--ink);line-height:1.7}
  .insight ul{margin:6px 0 0 18px;font-size:13px;color:var(--ink2);line-height:1.8}

  /* misc */
  .seg{display:inline-flex;background:#F5E6E6;border-radius:10px;padding:3px;gap:2px}
  .seg button{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2);transition:all .15s}
  .seg button.on{background:#fff;color:var(--clay);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .muted{color:var(--ink3)} .small{font-size:12px}
  .row{display:flex;align-items:center;gap:8px}
  .row-between{display:flex;align-items:center;justify-content:space-between}
  .mt8{margin-top:8px} .mt16{margin-top:16px} .mb16{margin-bottom:16px}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:300;opacity:0;transition:all .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* mood */
  .mood-row{display:flex;gap:8px;flex-wrap:wrap}
  .mood-btn{width:42px;height:42px;border-radius:12px;background:#FAF3F3;border:1px solid var(--line);font-size:20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .mood-btn:hover{transform:scale(1.1)}
  .mood-btn.sel{background:var(--butter);border-color:var(--clay);transform:scale(1.05)}
  .photo-row{display:flex;gap:10px}
  .photo-box{width:90px;height:90px;border-radius:12px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:all .15s;background:#FAF3F3}
  .photo-box:hover{border-color:var(--clay)}
  .photo-box span{font-size:24px;color:var(--ink3)}
  .photo-box small{font-size:11px;color:var(--ink3);margin-top:2px}
  .photo-box .photo-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
  .photo-thumbs{display:flex;gap:6px;margin-top:6px}
  .photo-thumbs img{width:50px;height:50px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .gal-item{background:var(--card);border-radius:var(--radius);padding:14px;border:1px solid rgba(232,216,216,.5);cursor:pointer;transition:all .15s}
  .gal-item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .gal-emo{font-size:28px;margin-bottom:6px}

<script>
/* ============================================================
   TAN - 单文件应用
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let photoTemp = {};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const now = () => new Date().toISOString().slice(0,16);
const fmt = d => d ? new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}) : '';
const fmtMoney = n => '¥' + Math.round(n).toLocaleString();
const escape = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Storage ===== */
const STORE_KEY = 'tan_workbench_v1';
let DB = loadDB();
function loadDB(){
  try{ const d = JSON.parse(localStorage.getItem(STORE_KEY)); if(d) return d; }catch(e){}
  return { orders:[], account:[], countdowns:[], stock:[], customers:[], inspires:[], checkins:[], meta:{created:now()} };
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

/* ===== View Router ===== */
const VIEWS = {
  orders:   {title:'工作室订单', render:renderOrders, date:''},
  account:  {title:'工作室记账本', render:renderAccount},
  countdown:{title:'重要日期倒计时', render:renderCountdown},
  week:     {title:'周度数据分析', render:renderWeek},
  backup:   {title:'备份与恢复', render:renderBackup},
};
let currentView = 'orders';

function switchView(v){
  currentView = v;
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view===v));
  $('#viewTitle').textContent = VIEWS[v].title;
  const d = new Date();
  $('#viewDate').textContent = `${d.getMonth()+1}月${d.getDate()}日 ${['日','一','二','三','四','五','六'][d.getDay()]}`;
  $('#content').innerHTML = '';
  VIEWS[v].render();
}
$$('.nav-item').forEach(n => n.addEventListener('click', () => switchView(n.dataset.view)));

/* ===== Toast ===== */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2000); }

/* ===== Modal ===== */
function openModal(title, bodyHTML, footHTML){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHTML;
  $('#modalFoot').innerHTML = footHTML || '<button class="btn" onclick="closeModal()">关闭</button>';
  $('#modalMask').classList.add('open');
}
function closeModal(){ $('#modalMask').classList.remove('open'); }
$('#modalClose').addEventListener('click', closeModal);
$('#modalMask').addEventListener('click', e => { if(e.target===$('#modalMask')) closeModal(); });

/* ===== Helpers ===== */
function confirmDel(name, cb){
  openModal('确认删除', `<p style="padding:10px 0">确定删除「${escape(name)}」吗？此操作不可撤销。</p>`,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="delConfirm">删除</button>`);
  $('#delConfirm').addEventListener('click', ()=>{ closeModal(); cb(); });
}

/* ============================================================
   1. 订单模块
   ============================================================ */
const ORDER_STATUS = [
  {key:'paid', label:'已付款', cls:'tag-paid'},
  {key:'making', label:'制作中', cls:'tag-making'},
  {key:'delivery', label:'待配送', cls:'tag-delivery'},
  {key:'done', label:'已完成', cls:'tag-done'},
];
function renderOrders(){
  const c = $('#content');
  const todays = DB.orders.filter(o => o.createdAt && o.createdAt.slice(0,10)===today());
  const todayDone = DB.orders.filter(o => o.status==='done' && o.doneDate && o.doneDate.slice(0,10)===today()).length;
  const todayTotal = DB.orders.filter(o => o.createdAt && o.createdAt.slice(0,10)===today()).length;
  // 今日完成率：以今日新增或今日完成的订单为分母
  const denom = DB.orders.filter(o => (o.createdAt&&o.createdAt.slice(0,10)===today()) || (o.doneDate&&o.doneDate.slice(0,10)===today())).length;
  const rate = denom ? Math.round(todayDone/denom*100) : 0;
  const active = DB.orders.filter(o => o.status!=='done').sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  const done = DB.orders.filter(o => o.status==='done').sort((a,b)=>(b.doneDate||'').localeCompare(a.doneDate||''));

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat s1"><div class="stat-label">今日完成率</div><div class="stat-val">${rate}<small>%</small></div><div class="progress"><div class="progress-bar" style="width:${rate}%"></div></div></div>
      <div class="stat s2"><div class="stat-label">进行中订单</div><div class="stat-val">${active.length}<small>单</small></div></div>
      <div class="stat s3"><div class="stat-label">今日新增</div><div class="stat-val">${todayTotal}<small>单</small></div></div>
      <div class="stat s4"><div class="stat-label">累计完成</div><div class="stat-val">${done.length}<small>单</small></div></div>
    </div>
    <div class="row-between mb16">
      <div class="row"><button class="btn btn-primary" id="addOrder">+ 新建订单</button></div>
      <div class="seg" id="orderFilter">
        <button class="on" data-f="all">全部</button>
        <button data-f="active">进行中</button>
        <button data-f="done">已完成</button>
      </div>
    </div>
    <div class="list" id="orderList"></div>
  `;
  $('#addOrder').addEventListener('click', ()=>orderForm());
  $('#orderFilter').addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    $$('#orderFilter button').forEach(b=>b.classList.remove('on'));
    e.target.classList.add('on');
    drawOrders(e.target.dataset.f);
  });
  drawOrders('all');
}
function drawOrders(filter){
  let list = DB.orders.slice();
  if(filter==='active') list = list.filter(o=>o.status!=='done');
  if(filter==='done') list = list.filter(o=>o.status==='done');
  list.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const box = $('#orderList');
  if(!list.length){ box.innerHTML = '<div class="empty"><div class="empty-ico">📋</div>暂无订单，点击右上角新建</div>'; return; }
  box.innerHTML = list.map(o=>{
    const st = ORDER_STATUS.find(s=>s.key===o.status) || ORDER_STATUS[0];
    const checked = o.status==='done' ? 'checked' : '';
    return `<div class="list-item ${checked?'done':''}">
      <div class="checkbox ${checked}" data-toggle="${o.id}"></div>
      <div class="li-main">
        <div class="li-title">${escape(o.style||'未命名款式')} · ${escape(o.recipient||'')}</div>
        <div class="li-sub">
          <span class="tag ${st.cls}">${st.label}</span>
          <span>📅 ${fmt(o.orderDate||o.createdAt)}</span>
          <span>⏰ ${escape(o.useTime||'-')}</span>
          <span>${o.deliveryType==='pickup'?'🏪 自提':'🚗 配送'}</span>
          ${o.contact?`<span>📱 ${escape(o.contact)}</span>`:''}
          ${o.deliveryType==='delivery'&&o.address?`<span>📍 ${escape(o.address)}</span>`:''}
        </div>
        ${o.card?`<div class="li-sub" style="margin-top:4px;color:var(--ink2)">💌 ${escape(o.card)}</div>`:''}
        ${(o.price||o.errandCost||o.errandIncome)?`<div class="li-sub" style="margin-top:4px">
          ${o.price?`<span class="tag tag-income">💰 ¥${o.price}</span>`:''}
          ${o.errandCost?`<span class="tag tag-expense">🛵 支出 ¥${o.errandCost}</span>`:''}
          ${o.errandIncome?`<span class="tag tag-income">🛵 收入 ¥${o.errandIncome}</span>`:''}
        </div>`:''}
        ${(o.photo1||o.photo2)?`<div class="photo-thumbs"><img src="${o.photo1||''}" ${o.photo1?'':'hidden'}><img src="${o.photo2||''}" ${o.photo2?'':'hidden'}></div>`:''}
        ${o.note?`<div class="li-sub" style="margin-top:4px">📝 ${escape(o.note)}</div>`:''}
      </div>
      <div class="li-actions">
        <button class="btn btn-icon btn-ghost" data-edit="${o.id}" title="编辑">✎</button>
        <button class="btn btn-icon btn-ghost" data-del="${o.id}" title="删除">🗑</button>
      </div>
    </div>`;
  }).join('');
  // bind
  box.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const o = DB.orders.find(x=>x.id===el.dataset.toggle);
    if(o.status==='done'){ o.status='paid'; o.doneDate=null; }
    else { o.status='done'; o.doneDate=now(); }
    saveDB(); renderOrders();
  }));
  box.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>orderForm(el.dataset.edit)));
  box.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    const o = DB.orders.find(x=>x.id===el.dataset.del);
    confirmDel(o.style||o.recipient||'订单', ()=>{ DB.orders = DB.orders.filter(x=>x.id!==el.dataset.del); DB.account = DB.account.filter(a=>a.orderId!==el.dataset.del); saveDB(); renderOrders(); toast('已删除'); });
  }));
}
function orderForm(id){
  const o = id ? DB.orders.find(x=>x.id===id) : {};
  photoTemp = {1: '', 2: ''};
  const body = `
    <div class="form-row r2">
      <div class="field"><label>订单时间</label><input type="date" id="f_orderDate" value="${o.orderDate||today()}"></div>
      <div class="field"><label>用花时间</label><input type="text" id="f_useTime" placeholder="如 3月8日 14:00" value="${escape(o.useTime||'')}"></div>
    </div>
    <div class="form-row r2">
      <div class="field"><label>订单款式</label><input type="text" id="f_style" placeholder="如 粉色玫瑰花束" value="${escape(o.style||'')}"></div>
      <div class="field"><label>订单状态</label><select id="f_status">${ORDER_STATUS.map(s=>`<option value="${s.key}" ${o.status===s.key?'selected':''}>${s.label}</option>`).join('')}</select></div>
    </div>
    <div class="form-row r2">
      <div class="field"><label>配送方式</label><select id="f_delivery"><option value="pickup" ${o.deliveryType==='pickup'?'selected':''}>自提</option><option value="delivery" ${o.deliveryType==='delivery'?'selected':''}>配送</option></select></div>
      <div class="field"><label>收花人</label><input type="text" id="f_recipient" value="${escape(o.recipient||'')}"></div>
    </div>
    <div class="form-row r2">
      <div class="field"><label>收花人联系方式</label><input type="text" id="f_contact" placeholder="手机号" value="${escape(o.contact||'')}"></div>
      <div class="field"><label>配送地址（配送时填）</label><input type="text" id="f_address" value="${escape(o.address||'')}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>卡片内容</label><textarea id="f_card" placeholder="写在花束卡片上的话">${escape(o.card||'')}</textarea></div>
    <div class="form-row r3" style="margin-top:10px">
      <div class="field"><label>订单价格</label><input type="number" id="f_price" placeholder="0" value="${o.price||''}"></div>
      <div class="field"><label>跑腿收入</label><input type="number" id="f_errandIncome" placeholder="0" value="${o.errandIncome||''}"></div>
      <div class="field"><label>跑腿支出</label><input type="number" id="f_errandCost" placeholder="0" value="${o.errandCost||''}"></div>
    </div>
    <div class="small muted" style="margin-top:4px">保存后订单价格、跑腿收支会自动记入记账本</div>
    <div class="field" style="margin-top:10px"><label>花束照片</label>
      <div class="photo-row">
        <label class="photo-box" id="photoBox1" style="${o.photo1?'background-image:url('+o.photo1+');background-size:cover;background-position:center':''}">
          ${o.photo1?'':'<span>+</span><small>照片1</small>'}
          <input type="file" accept="image/*" class="photo-input" data-idx="1" style="display:none">
        </label>
        <label class="photo-box" id="photoBox2" style="${o.photo2?'background-image:url('+o.photo2+');background-size:cover;background-position:center':''}">
          ${o.photo2?'':'<span>+</span><small>照片2</small>'}
          <input type="file" accept="image/*" class="photo-input" data-idx="2" style="display:none">
        </label>
      </div>
    </div>
    <div class="field" style="margin-top:10px"><label>备注</label><textarea id="f_note" placeholder="其他备注信息">${escape(o.note||'')}</textarea></div>
  `;
  openModal(id?'编辑订单':'新建订单', body,
    `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="saveOrder">保存</button>`);
  $('#saveOrder').addEventListener('click', ()=>{
    try{
    const data = {
      orderDate: $('#f_orderDate').value,
      useTime: $('#f_useTime').value.trim(),
      style: $('#f_style').value.trim(),
      status: $('#f_status').value,
      deliveryType: $('#f_delivery').value,
      recipient: $('#f_recipient').value.trim(),
      contact: $('#f_contact').value.trim(),
      address: $('#f_address').value.trim(),
      card: $('#f_card').value.trim(),
      note: $('#f_note').value.trim(),
      photo1: photoTemp[1] || (id ? o.photo1 : '') || '',
      photo2: photoTemp[2] || (id ? o.photo2 : '') || '',
      price: +$('#f_price').value || 0,
      errandCost: +$('#f_errandCost').value || 0,
      errandIncome: +$('#f_errandIncome').value || 0,
    };
    photoTemp = {};
    let orderId = id;
    if(id){
      // 编辑时先删除该订单关联的旧记账记录
      DB.account = DB.account.filter(a => !(a.orderId === id));
      Object.assign(o, data);
    } else {
      const newOrder = {id:uid(), createdAt:now(), doneDate: data.status==='done'?now():null, ...data};
      DB.orders.push(newOrder);
      orderId = newOrder.id;
    }
    // 自动写入记账本
    const accDate = data.orderDate || today();
    const orderLabel = `${data.style||'花束'}${data.recipient?'·'+data.recipient:''}`;
    if(data.price > 0){
      DB.account.push({id:uid(), orderId:orderId, type:'income', amount:data.price, date:accDate, cat:'工作室收入', note:'订单收入 '+orderLabel});
    }
    if(data.errandCost > 0){
      DB.account.push({id:uid(), orderId:orderId, type:'expense', amount:data.errandCost, date:accDate, cat:'跑腿', note:'跑腿支出 '+orderLabel});
    }
    if(data.errandIncome > 0){
      DB.account.push({id:uid(), orderId:orderId, type:'income', amount:data.errandIncome, date:accDate, cat:'工作室收入', note:'跑腿收入 '+orderLabel});
    }
    saveDB(); closeModal(); renderOrders(); toast(id?'已更新':'已添加');
    }catch(err){ toast('保存失败: '+err.message); console.error(err); }
  });
  // 图片上传
  document.querySelectorAll('.photo-input').forEach(inp => {
    inp.addEventListener('change', function(){
      const file = this.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e){
        const idx = inp.dataset.idx;
        photoTemp[idx] = e.target.result;
        const box = document.getElementById('photoBox'+(idx));
        box.style.backgroundImage = 'url('+e.target.result+')';
        box.style.backgroundSize = 'cover';
        box.style.backgroundPosition = 'center';
        box.innerHTML = '<small class="photo-del" data-idx="'+idx+'">✕</small>';
        // 删除按钮
        box.querySelector('.photo-del').addEventListener('click', function(ev){
          ev.stopPropagation(); ev.preventDefault();
          photoTemp[idx] = '';
          box.style.backgroundImage = '';
          box.innerHTML = '<span>+</span><small>照片'+(idx)+'</small>';
          const fi = box.querySelector('input');
          if(fi) fi.value = '';
          initPhotoInputs();
        });
      };
      reader.readAsDataURL(file);
    });
  });
  function initPhotoInputs(){
    document.querySelectorAll('.photo-input').forEach(inp => {
      inp.addEventListener('click', function(e){ e.stopPropagation(); });
    });
  }
  initPhotoInputs();
}

/* ============================================================
   2. 记账模块
   ============================================================ */
const EXPENSE_CATS = ['资材','进花','跑腿','水电费','房租','物业费','车位费','餐饮','交通','购物','娱乐','住房','医疗','教育','工资','理财','其他'];
const INCOME_CATS = ['工作室收入','理财收益','其他'];
let pieChart = null;
let accFilter = 'month';
function renderAccount(){
  const c = $('#content');
  const now0 = new Date();
  const ym = `${now0.getFullYear()}-${String(now0.getMonth()+1).padStart(2,'0')}`;
  const yy = `${now0.getFullYear()}`;
  const monthRecs = DB.account.filter(a=>a.date&&a.date.startsWith(ym));
  const yearRecs = DB.account.filter(a=>a.date&&a.date.startsWith(yy));
  const sumIncome = arr => arr.filter(a=>a.type==='income').reduce((s,a)=>s+(+a.amount||0),0);
  const sumExpense = arr => arr.filter(a=>a.type==='expense').reduce((s,a)=>s+(+a.amount||0),0);
  const mIn=sumIncome(monthRecs), mOut=sumExpense(monthRecs), mBal=mIn-mOut;
  const yIn=sumIncome(yearRecs), yOut=sumExpense(yearRecs), yBal=yIn-yOut;

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat s1"><div class="stat-label">本月收入</div><div class="stat-val">${fmtMoney(mIn)}</div></div>
      <div class="stat s3"><div class="stat-label">本月支出</div><div class="stat-val">${fmtMoney(mOut)}</div></div>
      <div class="stat s2"><div class="stat-label">本月结余</div><div class="stat-val" style="color:${mBal>=0?'#7A8BA8':'#A890A0'}">${fmtMoney(mBal)}</div></div>

function drawPie(recs){
  const ctx = $('#pieChart'); if(!ctx) return;
  const exp = recs.filter(a=>a.type==='expense');
  const byCat = {};
  exp.forEach(a=>{ byCat[a.cat]=(byCat[a.cat]||0)+(+a.amount||0); });
  const labels = Object.keys(byCat); const data = Object.values(byCat);
  const colors = ['#DCD3E8','#C6D5EA','#F5E6E6','#FEFBB4','#D0C4E0','#B8CDE0','#E8DCDC','#F8F4C0','#CDC0DC','#C0D0E4','#EDD8D8','#FCF7B8','#D4C8E4','#BED2E8','#E4D4D4','#FEF8B0'];
  if(pieChart) pieChart.destroy();
  if(!labels.length){
    ctx.parentElement.innerHTML = '<div class="empty"><div class="empty-ico">🥧</div>本月暂无支出记录</div>';
    return;
  }
  pieChart = new Chart(ctx, {
    type:'doughnut',
    data:{ labels, datasets:[{ data, backgroundColor:colors.slice(0,labels.length), borderWidth:2, borderColor:'#fff' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'right', labels:{ font:{size:11}, padding:8, boxWidth:12 } }, tooltip:{ callbacks:{ label:c=>` ${c.label}: ¥${Math.round(c.raw)}` } } }, cutout:'60%' }
  });
}
function drawAcc(){
  const now0=new Date(); const ym=`${now0.getFullYear()}-${String(now0.getMonth()+1).padStart(2,'0')}`; const yy=`${now0.getFullYear()}`;
  let list = DB.account.slice();

  if(accFilter==='year') list=list.filter(a=>a.date&&a.date.startsWith(yy));

const MOODS=[{e:'😄',l:'开心',v:5},{e:'🙂',l:'平静',v:4},{e:'😐',l:'一般',v:3},{e:'😔',l:'低落',v:2},{e:'😢',l:'糟糕',v:1}];
function getWeekCheckins(){
  const nowd=new Date(); const day=nowd.getDay()||7;
  const monday=new Date(nowd); monday.setDate(nowd.getDate()-day+1); monday.setHours(0,0,0,0);
  const arr=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    arr.push(DB.checkins.find(x=>x.date===ds)||null);
  }
  return arr;
}

/* ============================================================
   周度数据分析
   ============================================================ */
function renderWeek(){
  const c=$('#content');
  const nowd=new Date(); const day=nowd.getDay()||7;
  const monday=new Date(nowd); monday.setDate(nowd.getDate()-day+1); monday.setHours(0,0,0,0);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  const inWeek = d => { const t=new Date(d); return t>=monday && t<=sunday; };
  const weekOrders = DB.orders.filter(o=>o.createdAt&&inWeek(o.createdAt));
  const weekDone = DB.orders.filter(o=>o.doneDate&&inWeek(o.doneDate));
  const weekAcc = DB.account.filter(a=>a.date&&inWeek(a.date));
  const wIn=weekAcc.filter(a=>a.type==='income').reduce((s,a)=>s+(+a.amount||0),0);
  const wOut=weekAcc.filter(a=>a.type==='expense').reduce((s,a)=>s+(+a.amount||0),0);
  const weekCheckins=getWeekCheckins().filter(Boolean);
  const lowStock=DB.stock.filter(s=>+s.qty<=(+s.min||0));
  const upcoming=DB.countdowns.filter(d=>{ const t=new Date(d.date); const diff=(t-nowd)/86400000; return diff>=0&&diff<=30; });

  // AI 洞察
  const insights=[];
  if(weekDone.length>=5) insights.push(`本周完成 ${weekDone.length} 单，节奏稳定，保持住！`);
  if(wOut>wIn && wOut>0) insights.push(`本周支出 ¥${Math.round(wOut)} 超过收入 ¥${Math.round(wIn)}，注意控制成本。`);
  if(lowStock.length) insights.push(`${lowStock.length} 种花材库存不足：${lowStock.map(s=>s.name).join('、')}，建议尽快补货。`);
  if(upcoming.length) insights.push(`30天内有 ${upcoming.length} 个重要日期临近：${upcoming.map(d=>d.name+'('+fmt(d.date)+')').join('、')}。`);
  if(weekCheckins.length>=3){
    const avg=(weekCheckins.reduce((s,x)=>s+(+x.mood||3),0)/weekCheckins.length).toFixed(1);
    insights.push(`本周打卡 ${weekCheckins.length} 天，平均心情 ${avg} 分，状态不错。`);
  }
  if(!insights.length) insights.push('本周数据较少，继续记录可获得更精准的洞察。');

  c.innerHTML=`
    <div class="card mb16">
      <div class="card-h"><h3>📊 本周数据汇总</h3><span class="sub">${monday.toLocaleDateString('zh-CN')} - ${sunday.toLocaleDateString('zh-CN')}</span></div>
      <div class="week-grid">
        <div class="week-card"><h4>新增订单</h4><div class="v">${weekOrders.length}<small style="font-size:13px;color:var(--ink3);margin-left:4px">单</small></div></div>
        <div class="week-card"><h4>完成订单</h4><div class="v">${weekDone.length}<small style="font-size:13px;color:var(--ink3);margin-left:4px">单</small></div></div>
        <div class="week-card"><h4>本周收入</h4><div class="v" style="color:#7A8BA8">${fmtMoney(wIn)}</div></div>
        <div class="week-card"><h4>本周支出</h4><div class="v" style="color:#A890A0">${fmtMoney(wOut)}</div></div>
        <div class="week-card"><h4>本周结余</h4><div class="v" style="color:${wIn-wOut>=0?'#7A8BA8':'#A890A0'}">${fmtMoney(wIn-wOut)}</div></div>
        <div class="week-card"><h4>打卡天数</h4><div class="v">${weekCheckins.length}<small style="font-size:13px;color:var(--ink3);margin-left:4px">/7</small></div></div>
        <div class="week-card"><h4>库存预警</h4><div class="v">${lowStock.length}<small style="font-size:13px;color:var(--ink3);margin-left:4px">项</small></div></div>
        <div class="week-card"><h4>临近日期</h4><div class="v">${upcoming.length}<small style="font-size:13px;color:var(--ink3);margin-left:4px">个</small></div></div>
      </div>
    </div>
    <div class="insight">
      <h4>🤖 AI 洞察建议</h4>
      <ul>${insights.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>
  `;
}

/* ===== 导入导出 ===== */
function exportJSON(){
  const data = JSON.stringify({...DB, exportedAt:now()}, null, 2);
  // iOS Safari 不支持 a.download，用剪贴板 + 新窗口双保险
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(()=>{
      toast('备份已复制到剪贴板！打开备忘录粘贴保存');
    }).catch(()=>{
      openExportWindow(data);
    });
  } else {
    openExportWindow(data);
  }
}
function openExportWindow(data){
  const w = window.open('', '_blank');
  if(w){
    w.document.write('<html><head><title>TAN备份</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;padding:16px;font-family:monospace;font-size:12px;word-break:break-all"><p style="color:#666;margin-bottom:10px">长按下方文字 → 全选 → 复制，粘贴到备忘录保存</p><div id="d">'+data.replace(/</g,'&lt;')+'</div><scr'+'ipt>document.getElementById("d").addEventListener("click",function(){var r=document.createRange();r.selectNode(this);getSelection().removeAllRanges();getSelection().addRange(r)})</scr'+'ipt></body></html>');
    w.document.close();
    toast('新窗口已打开，长按文字复制');
  } else {
    // 最后兜底：直接在页面显示
    openModal('备份数据（长按复制）', '<textarea style="width:100%;height:300px;font-size:11px;font-family:monospace" readonly onclick="this.select()">'+data.replace(/</g,'&lt;')+'</textarea>', '<button class="btn" onclick="closeModal()">关闭</button>');
    toast('长按文本框全选复制');
  }
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      openModal('确认导入', `<p style="padding:10px 0">检测到备份文件，包含：<br>• 订单 ${data.orders?.length||0} 条<br>• 记账 ${data.account?.length||0} 条<br>• 倒计时 ${data.countdowns?.length||0} 条<br>• 花材 ${data.stock?.length||0} 条<br>• 客户 ${data.customers?.length||0} 条<br><br>导入将<b>覆盖</b>当前数据，是否继续？</p>`,
        `<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="importOk">导入</button>`);
      $('#importOk').addEventListener('click',()=>{
        DB = {
          orders:data.orders||[], account:data.account||[], countdowns:data.countdowns||[],
          stock:data.stock||[], customers:data.customers||[], inspires:data.inspires||[],
          checkins:data.checkins||[], meta:data.meta||{created:now()}
        };
        saveDB(); closeModal(); switchView(currentView); toast('导入成功');
      });
    }catch(err){ toast('文件格式错误'); }
  };
  reader.readAsText(file);
}

/* ============================================================
   AI 智能输入浮窗 - 本地规则识别
   ============================================================ */
const AI = {
  parse(text){
    const t = text.trim();
    if(!t) return null;
    const result = {raw:t, matched:[], suggestions:[]};

    // ========== 1. 订单识别 ==========
    // 增强版：支持 "28号 下午4:10 配送 张三 13800138000 朝阳区xxx" 这种自由格式
    // 也支持 "5号有订单 粉色玫瑰 已付款"
    const hasOrderSignal = /订单|配送|自提|送花|订花|花束|捧花|花篮|开业/.test(t)
      || /玫瑰|康乃馨|百合|向日葵|郁金香|绣球|满天星|洋桔梗|尤加利/.test(t)
      || /收花|几号.*花|什么.*花/.test(t)
      || (/\d{1,2}号/.test(t) && /配送|送|花|收|联系|地址/.test(t));
    
    if(hasOrderSignal){
      // --- 日期解析 ---
      let orderDate = today();
      const dateM = t.match(/(\d{1,2})月(\d{1,2})[号日]/) || t.match(/(\d{1,2})[号日]/) || t.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if(dateM){
        if(dateM[1].length===4){
          orderDate = `${dateM[1]}-${String(dateM[2]).padStart(2,'0')}-${String(dateM[3]).padStart(2,'0')}`;
        } else if(dateM[2]){
          const m = dateM[1]; const d = dateM[2];
          orderDate = `${new Date().getFullYear()}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        } else {
          const d = dateM[1];
          const nowM = new Date().getMonth()+1;
          orderDate = `${new Date().getFullYear()}-${String(nowM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        }
      }

      // --- 时间解析 ---
      let useTime = '';
      const timeM = t.match(/(?:下午|上午|中午|晚上|傍晚)?\s*(\d{1,2})[:：](\d{2})/);
      if(timeM){
        let h = +timeM[1];
        const isPM = /下午|晚上|傍晚/.test(t);
        if(isPM && h < 12) h += 12;
        useTime = `${String(h).padStart(2,'0')}:${timeM[2]}`;
      }

      // --- 状态解析 ---
      let status='paid';
      if(/制作|做中|准备/.test(t)) status='making';
      if(/配(?:送|货)|发货|送到/.test(t)) status='delivery';
      if(/完成|已完|做好/.test(t)) status='done';

      // --- 配送方式 ---
      const delivery = /自提|到店|自己取|来拿/.test(t) ? 'pickup' : 'delivery';

      // --- 联系方式（手机号） ---
      const phoneM = t.match(/1[3-9]\d{9}/);

      // --- 收花人 ---
      let recipient = '';
      const recipPatterns = [
        /收花人[：:\s]*(\S{1,8})/,
        /收花[：:\s]*(\S{1,8})/,
        /给\s*(\S{1,8})\s*(?:送|的)/,
        /送[给到]\s*(\S{1,8})/,
        /联系人[：:\s]*(\S{1,8})/,
        /(?:配送|送).*?给\s*(\S{1,8})/,
      ];
      for(const p of recipPatterns){
        const m = t.match(p);
        if(m){ recipient = m[1].replace(/[，,。.!！\s]/g,''); break; }
      }
      // 如果没有明确的收花人关键词，但有手机号前面的名字
      if(!recipient && phoneM){
        const beforePhone = t.slice(0, t.indexOf(phoneM[0]));
        const nameM = beforePhone.match(/([^\s,，。.!！\d]{1,6})\s*$/);
        if(nameM && !/号|月|日|点|分|配|送|自|提|收|花|地|址|联|系/.test(nameM[1])) recipient = nameM[1];
      }

      // --- 地址 ---
      let address = '';
      const addrPatterns = [
        /地址[：:\s]*(\S{3,30})/,
        /送到[：:\s]*(\S{3,30})/,
        /配送[：:\s]*(\S{3,30})/,
        /(?:路|街|区|楼|号|小区|大厦|广场|中心|花园|苑|城|村|镇|乡)(\S{0,20})/,
      ];
      for(const p of addrPatterns){
        const m = t.match(p);
        if(m){ address = m[1] || m[0]; break; }
      }
      if(!address){
        const addrM = t.match(/([\u4e00-\u9fa5]{2,10}(?:路|街|道|巷|弄|区|楼|号|小区|大厦|广场|中心|花园|苑|城|村|镇))\s*\d*/);
        if(addrM) address = addrM[0];
      }

      // --- 款式 ---
      let style = '花束';
      const stylePatterns = [
        /((?:粉|红|白|黄|紫|蓝|香槟|橘|橙|彩色?)?\s*(?:玫瑰|康乃馨|百合|向日葵|郁金香|绣球|满天星|洋桔梗|尤加利|雏菊|桔梗|勿忘我|马蹄莲)\s*(?:花束|捧花|花篮|花盒|花环|桌花|瓶插)?)/,
        /((?:开业|婚礼|生日|求婚|表白|道歉|慰问|庆典|母亲节|父亲节|教师节|情人节)\s*(?:花篮|花束|捧花)?)/,
        /((?:玫瑰|康乃馨|百合|向日葵|郁金香|绣球)\s*(?:花束|捧花|花篮|花盒|花环|桌花|瓶插|花))/,
      ];
      for(const p of stylePatterns){
        const m = t.match(p);
        if(m && m[1].length > 1){ style = m[1]; break; }
      }

      // --- 卡片 ---
      let card = '';
      // 多种卡片表达方式：卡片 xxx / 卡片内容 xxx / 写 xxx / 祝福语 xxx / 留言 xxx
      const cardPatterns = [
        /卡片[：:\s]*[""「」]?(.{2,60}?)(?:[""「」]?\s*(?:$|[，,。.!！\n]|\s{2}))/,
        /卡片内容[：:\s]*(.{2,60}?)(?:$|[，,。.!！\n]|\s{2})/,
        /写[：:\s]*[""「」]?(.{2,60}?)(?:[""「」]?\s*(?:$|[，,。.!！\n]|\s{2}))/,
        /祝福语[：:\s]*(.{2,60}?)(?:$|[，,。.!！\n]|\s{2})/,
        /留言[：:\s]*(.{2,60}?)(?:$|[，,。.!！\n]|\s{2})/,
        /卡片[：:\s]*(.{2,60})/,
      ];
      for(const p of cardPatterns){
        const m = t.match(p);
        if(m && m[1] && m[1].trim().length >= 1){
          card = m[1].trim();
          break;
        }
      }

      // --- 备注 ---
      let note = t.replace(phoneM?phoneM[0]:'', '');
      // 去掉卡片部分
      note = note.replace(/卡片[内容]?\s*[：:\s]*[""「」]?.{0,60}?[""「」]?\s*/,'');
      note = note.replace(/写\s*[：:\s]*[""「」]?.{0,60}?[""「」]?\s*/,'');
      note = note.replace(/祝福语\s*[：:\s]*.{0,60}?\s*/,'');
      note = note.replace(/留言\s*[：:\s]*.{0,60}?\s*/,'');
      note = note.replace(/\s+/g,' ').trim();

      const order = {
        id:uid(), createdAt:now(), doneDate: status==='done'?now():null,
        orderDate, useTime, style: style||'花束',
        status, deliveryType: delivery,
        recipient, contact: phoneM?phoneM[0]:'',
        address, card, note
      };
      DB.orders.push(order); saveDB();
      let desc = `${order.style} · ${ORDER_STATUS.find(s=>s.key===status).label}`;
      if(order.recipient) desc += ` · ${order.recipient}`;
      if(order.useTime) desc += ` · ${order.useTime}`;
      result.matched.push({type:'订单', desc});
    }

    // ========== 2. 记账识别 ==========
    if(/花(?:了|费|销)|支出|买|进(?:货|花)|付|充|交/.test(t) || /收入|收(?:到|入)|赚|卖/.test(t)){
      const amtM = t.match(/(\d+(?:\.\d{1,2})?)\s*(?:块|元|￥|¥|元)?/);
      if(amtM){
        const amount = +amtM[1];
        const isIncome = /收入|收到|赚|卖|进账/.test(t);
        let cat = isIncome ? '工作室收入' : '其他';
        const catMap = {'进花|花材|玫瑰|康乃馨|百合':'进花','资材|包装|丝带|花泥|纸':'资材','跑腿|外卖|配送费':'跑腿','水电|电费|水费':'水电费','房租|租金':'房租','物业':'物业费','车位|停车':'车位费','吃|饭|餐|食|咖啡':'餐饮','车|地铁|公交|打车|滴滴':'交通','买|购|淘宝|京东':'购物','玩|游戏|电影|娱乐':'娱乐','房|租':'住房','医|药|看病':'医疗','学|课|书|培训':'教育','工资|薪':'工资','理财|基金|股票':'理财'};
        if(!isIncome){
          for(const k in catMap){ if(new RegExp(k).test(t)){ cat=catMap[k]; break; } }
        } else {
          if(/理财|基金|股票|利息/.test(t)) cat='理财收益';
        }
        DB.account.push({id:uid(), type:isIncome?'income':'expense', amount, date:today(), cat, note:t.replace(amtM[0],'').trim().slice(0,40)});
        saveDB();
        result.matched.push({type:isIncome?'收入':'支出', desc:`${cat} ${fmtMoney(amount)}`});
      }
    }

    // ========== 3. 倒计时识别 ==========
    if(/生日|纪念日|结婚|过节|圣诞|元旦|新年|春节|情人|母亲节|父亲节|教师节|婚礼|纪念日|几号/.test(t)){
      const dateM = t.match(/(\d{1,2})月(\d{1,2})[号日]/) || t.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if(dateM){
        let date;
        if(dateM[1].length===4){
          date = `${dateM[1]}-${String(dateM[2]).padStart(2,'0')}-${String(dateM[3]).padStart(2,'0')}`;
        } else {
          date = `${new Date().getFullYear()}-${String(dateM[1]).padStart(2,'0')}-${String(dateM[2]).padStart(2,'0')}`;
        }
        const nameM = t.match(/([妈妈爸姐弟妹老婆老公儿子女儿闺蜜朋友]+(?:生日|纪念日))|((?:结婚|婚礼|圣诞|元旦|新年|春节|情人|母亲节|父亲节|教师节)(?:节)?)|(.{2,8}(?:生日|纪念日|结婚))/);
        const name = nameM ? (nameM[1]||nameM[2]||nameM[3]) : '重要日期';
        DB.countdowns.push({id:uid(), name, date, note:t});
        saveDB();
        result.matched.push({type:'倒计时', desc:`${name} · ${date}`});
      }
    }

    return result.matched.length ? result : null;
  }
};

/* AI 浮窗交互 */
let aiOpen=false;
const fab=$('#fab'), aiPanel=$('#aiPanel'), aiInput=$('#aiInput'), aiLog=$('#aiLog'), aiSend=$('#aiSend');
function toggleAI(open){ aiOpen = open===undefined ? !aiOpen : open; aiPanel.classList.toggle('open', aiOpen); if(aiOpen) setTimeout(()=>aiInput.focus(),200); }
fab.addEventListener('click', ()=>toggleAI());
$('#aiClose').addEventListener('click', ()=>toggleAI(false));
$$('.ai-chip').forEach(c=>c.addEventListener('click', ()=>{ aiInput.value=c.textContent; aiInput.focus(); }));
aiSend.addEventListener('click', sendAI);
aiInput.addEventListener('keydown', e=>{ if(e.key==='Enter') sendAI(); });

function addMsg(text, who){
  const div=document.createElement('div');
  div.className='ai-msg '+(who||'bot');
  div.innerHTML=text;
  aiLog.appendChild(div); aiLog.scrollTop=aiLog.scrollHeight;
}
function sendAI(){
  const text=aiInput.value.trim(); if(!text) return;
  addMsg(escape(text), 'user');
  aiInput.value='';
  setTimeout(()=>{
    const r = AI.parse(text);
    if(r){
      let html = '已识别并记录：<br>';
      r.matched.forEach(m=>{ html += `<b>✓ ${escape(m.type)}</b>：${escape(m.desc)}<br>`; });
      html += '<span class="small muted">已写入对应模块</span>';
      addMsg(html);
      if(currentView==='orders'||currentView==='account'||currentView==='countdown'||currentView==='stock'||currentView==='checkin') switchView(currentView);
    } else {
      addMsg('没太明白呢 😅 可以试试：<br>• "28号 下午4:10 配送 张三 13800138000 粉色玫瑰"<br>• "花了50块进花"<br>• "3月8号 妈妈生日"');
    }
  }, 300);
}

switchView('orders');

  localStorage.setItem('tan_seeded','1');

    {id:uid(), name:'情人节', date:`${new Date().getFullYear()}-02-14`, note:''}
  );
  DB.stock.push(
    {id:uid(), name:'粉色玫瑰', unit:'支', qty:30, min:10, price:3, supplier:'花卉市场'},
    {id:uid(), name:'康乃馨', unit:'支', qty:8, min:15, price:2, supplier:'花卉市场'}
  );
  saveDB();
}
